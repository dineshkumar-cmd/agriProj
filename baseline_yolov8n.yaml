# baseline_yolov8n
nc: 5

backbone:
  - [-1, 1, Conv,  [16, 3, 2]]                # 0-P1/2
  - [-1, 1, Conv,  [32, 3, 2]]                # 1-P2/4
  - [-1, 1, C2f,   [32, True]]                # 2
  - [-1, 1, Conv,  [64, 3, 2]]                # 3-P3/8
  - [-1, 2, C2f,   [64, True]]                # 4  (P3 skip)
  - [-1, 1, Conv,  [128, 3, 2]]               # 5-P4/16
  - [-1, 2, C2f,   [128, True]]               # 6  (P4 skip)
  - [-1, 1, Conv,  [256, 3, 2]]               # 7-P5/32
  - [-1, 1, C2f,   [256, True]]               # 8
  - [-1, 1, SPPF,  [256, 5]]                  # 9  (P5 skip)

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 10
  - [[-1, 6], 1, Concat, [1]]                         # 11  concat with P4
  - [-1, 1, C2f, [128, False]]                    # 12  P4'

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 13
  - [[-1, 4], 1, Concat, [1]]                         # 14  concat with P3
  - [-1, 1, C2f, [64, False]]                     # 15  P3' (small objects)

  - [-1, 1, Conv, [64, 3, 2]]                     # 16
  - [[-1, 12], 1, Concat, [1]]                         # 17  concat with P4'
  - [-1, 1, C2f, [128, False]]                    # 18  P4'' (medium objects)

  - [-1, 1, Conv, [128, 3, 2]]                    # 19
  - [[-1, 9], 1, Concat, [1]]                         # 20  concat with P5
  - [-1, 1, C2f, [256, False]]                    # 21  P5'' (large objects)

  - [[15, 18, 21], 1, Detect, [nc]]               # 22
